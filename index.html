<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crypto Price">
<link rel="preconnect" href="https://api.coingecko.com" crossorigin>
<link rel="preconnect" href="https://assets.coingecko.com" crossorigin>
<title>Crypto Price</title>
<style>
:root{--bg:#02040a;--panel:#0b1317;--line:#1d2b32;--txt:#f2f6f7;--mut:#8b9ba3;--g:#22e07a;--r:#ff4d4d;--p:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top)) 4px max(6px,env(safe-area-inset-bottom))}
header{padding:0 6px;display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;flex:none;border-radius:50%}
.ttl{flex:1;min-width:0}
h1{font-size:23px;line-height:1.1;font-weight:800;letter-spacing:-.3px}
h1 b{color:var(--g)}
.sub{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{padding:0 4px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:7px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 9px;display:flex;align-items:center;gap:8px;min-width:0}
.card svg{width:26px;height:26px;flex:none}
.card .v{font-size:17px;font-weight:800;line-height:1.1;white-space:nowrap}
.card .l{font-size:10.5px;color:var(--mut);margin-top:2px;white-space:nowrap}
.up{color:var(--g)}.dn{color:var(--r)}.nu{color:var(--p)}
.bar{padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{flex:1;display:flex;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.seg button{touch-action:manipulation;flex:1;background:none;border:0;color:var(--mut);font-weight:700;font-size:12.5px;padding:8px 2px;white-space:nowrap}
.seg button.on{background:#16262d;color:var(--txt);box-shadow:inset 0 -2px 0 var(--g)}
#stage{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 28% 18%,#1a1048 0%,rgba(26,16,72,0) 55%),radial-gradient(ellipse at 78% 84%,#0a2c40 0%,rgba(10,44,64,0) 55%),#02040a;border:1px solid #0e1a20}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
#ctl button{width:36px;height:36px;background:rgba(11,19,23,.85);border:1px solid var(--line);color:var(--txt);border-radius:10px;font-size:19px;font-weight:700;line-height:1;touch-action:manipulation}
#zl{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;color:var(--mut);background:rgba(11,19,23,.7);border:1px solid var(--line);border-radius:8px;padding:3px 7px;pointer-events:none}
#mm{position:absolute;right:8px;bottom:8px;width:88px;height:88px;border:1px solid var(--line);border-radius:12px;background:rgba(3,6,14,.72);touch-action:none;z-index:5}
#boot{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#140c38 0%,#02040a 70%);transition:opacity .3s}
#boot .bw{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;text-align:center}
#boot svg{width:70px;height:70px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bootT{font-weight:800;font-size:15px}
.bbar{width:200px;height:6px;border-radius:4px;background:#16262d;overflow:hidden}
.bbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22e07a,#a78bfa);transition:width .3s}
#bootN{font-size:11px;color:var(--mut);min-height:14px}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
#info{position:fixed;inset:0;margin:auto;width:min(92vw,380px);height:fit-content;z-index:21;display:none;background:rgba(11,19,23,.94);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.7);touch-action:none;transition:transform .22s ease}
#info.drag{transition:none}
#grab{width:38px;height:4px;border-radius:3px;background:#2c3d46;margin:-4px auto 8px}
#info .t{display:flex;align-items:center;gap:10px}
#info .more{display:block;margin-top:10px;border-top:1px solid var(--line);padding-top:9px;font-size:12px;color:var(--mut)}
#info .more p{display:flex;justify-content:space-between;padding:4px 0}
#info .more p b{color:var(--txt)}
#info img,#info .ph{width:36px;height:36px;border-radius:50%;flex:none;background:#fff}
#info .ph{display:grid;place-items:center;color:#000;font-weight:800;font-size:12px}
#info .n{font-weight:800;font-size:15px;min-width:0}
#info .n small{color:var(--mut);font-weight:600;margin-left:5px;font-size:11px}
#info .pr{margin-left:auto;text-align:right;font-weight:800;font-size:15px}
#info .pr small{display:block;font-size:11px;font-weight:700}
#info .row{display:flex;gap:6px;margin-top:9px;font-size:11.5px}
#info .row div{flex:1;background:#101c22;border-radius:9px;padding:5px 7px;color:var(--mut)}
#info .row b{display:block;font-size:13px;margin-top:1px}
#info a{display:block;margin-top:8px;color:var(--g);font-size:12px;text-decoration:none;font-weight:700}
#x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--mut);font-size:18px;padding:2px 6px}
.legend{display:flex;justify-content:center}
.legend div{display:flex;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:4px 2px}
.legend span{display:flex;align-items:center;gap:5px;font-size:10px;padding:0 10px;border-left:1px solid var(--line)}
.legend span:first-child{border:0}
.legend i{width:9px;height:9px;border-radius:50%}
.legend em{font-style:normal;color:var(--mut);font-size:9px}
@media (max-height:700px){.legend{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#000" stroke="#1d2b32" stroke-width="1"/><circle cx="19" cy="20" r="9" fill="#22e07a"/><circle cx="31" cy="14" r="5" fill="#ff4d4d"/><circle cx="30" cy="30" r="7" fill="#a78bfa"/><circle cx="13" cy="33" r="4" fill="#ff4d4d"/></svg>
    <div class="ttl"><h1>Crypto <b>Price</b></h1><div class="sub" id="sub">Memuat data CoinGecko…</div></div>
  </header>

  <div class="stats">
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 8h5a2 2 0 010 4H9m0 0h5.5a2 2 0 010 4H9M9 6v12M12 5v2M12 17v2"/></svg><div><div class="v" id="sCoins">–</div><div class="l">Total Koin</div></div></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="#22e07a"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="10" width="4" height="11" rx="1"/><rect x="17" y="5" width="4" height="16" rx="1"/></svg><div><div class="v" id="sCap">–</div><div class="l">Market Cap</div></div></div>
    <div class="card"><svg id="sArr" viewBox="0 0 24 24" fill="#22e07a"><path d="M12 4l9 15H3z"/></svg><div><div class="v up" id="sChg">–</div><div class="l">Rata-rata 24 Jam</div></div></div>
  </div>

  <div class="bar"><div class="seg" id="seg"><button data-s="pop" class="on">Populer</button><button data-s="gain">Gainer</button><button data-s="loss">Loser</button><button data-s="vol">Volatil</button></div></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ctl"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="reset" aria-label="Pusat galaksi">⟲</button></div>
    <div id="zl">×1.0</div>
    <canvas id="mm" width="176" height="176"></canvas>
    <div id="boot"><div class="bw">
      <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#000" stroke="#1d2b32" stroke-width="1"/><circle cx="19" cy="20" r="9" fill="#22e07a"/><circle cx="31" cy="14" r="5" fill="#ff4d4d"/><circle cx="30" cy="30" r="7" fill="#a78bfa"/><circle cx="13" cy="33" r="4" fill="#ff4d4d"/></svg>
      <div id="bootT">Menyiapkan galaksi…</div>
      <div class="bbar"><i id="bootB"></i></div>
      <div id="bootN"></div>
    </div></div>
    <div id="bd"></div>
    <div id="info"><div id="grab"></div><button id="x">×</button><div id="infoIn"></div></div>
  </div>

  <div class="legend"><div>
    <span><i style="background:var(--g)"></i>Naik <em id="nG">0</em></span>
    <span><i style="background:var(--r)"></i>Turun <em id="nR">0</em></span>
    <span><i style="background:var(--p)"></i>Netral <em id="nP">0</em></span>
  </div></div>
</div>

<script>
(function(){
'use strict';
/* ====== PENGATURAN ====== */
const API='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&sparkline=false&price_change_percentage=1h,24h,7d&page=';
const PER_PAGE=250;
const PAGES=40;              /* 40 x 250 = 10.000 koin */
const NEUTRAL=0.1;           /* % */
const REFRESH_MS=120000;     /* interval pembaruan */
const PER_REFRESH=6;         /* setelah muat penuh: halaman 1 + 5 halaman bergilir tiap pembaruan */
const FRESH_MS=600000;       /* cache lebih muda dari ini dianggap segar (tanpa sapuan penuh) */
const WS=10000;              /* ukuran dunia (satuan dunia): galaksi 10.000 x 10.000 */
const KD=3.2;                /* kerenggangan galaksi (makin besar makin lega) */
const MAXK=6;                /* zoom maksimum */
const SPR_MIN=3.5;           /* radius layar (px) minimum agar gelembung digambar sebagai logo 3D; hanya yang lebih kecil dari ini jadi titik warna */
const SPR_OUT=2.5;           /* batas keluar (histeresis) */

const COL={g:[34,224,122],r:[255,77,77],p:[167,139,250]};
const tf='24h';
let sortBy='pop';
const DPR=Math.min(window.devicePixelRatio||1,2);
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const coins=[];const byId=new Map();let list=[];let demo=false;
let W=0,H=0;const view={k:1,x:0,y:0};let selected=null;
let lastT=0,isLive=false,progress='',ready=false,needLay=false;
/* performa: koin aktif (bergerak) saja yang diproses fisika; koin kecil digambar lewat 1 lapisan cache saat zoom-out jauh */
const AT=[];let atN=0;const AC=26,AN=64;
let act=[],layerDirty=true,nBig=0,viewT=0,mmK=-1,mmX=0,mmY=0;
const LSZ=2048,LRES=LSZ/WS,LK=.18;let layer=null,layerOK=false,layerT=0;
function wake(c){layerDirty=true;if(!c.aw){c.aw=true;act.push(c);}}
function buildLayer(){
  if(!layer){layer=document.createElement('canvas');layer.width=layer.height=LSZ;}
  const g=layer.getContext('2d');g.clearRect(0,0,LSZ,LSZ);g.imageSmoothingQuality='high';
  for(let i=nBig;i<list.length;i++){
    const c=list[i];if(c.free)continue;
    if(c.mini===undefined&&imgs[c.id])mkMini(c,imgs[c.id]);
    if(!c.mini)continue;
    const r=c.tr*LRES;g.drawImage(AT[c.ma],c.mx,c.my,24,24,c.tx*LRES-r,c.ty*LRES-r,2*r,2*r);
  }
  layerDirty=false;layerOK=true;layerT=performance.now();
}

/* ====== FORMAT ====== */
const fmtP=p=>{if(p==null||!isFinite(p))return'-';const a=Math.abs(p),d=a>=1000?2:a>=1?4:a>=.01?6:a>=.0001?8:10;return '$'+p.toLocaleString('en-US',{minimumFractionDigits:d>4?Math.min(d,6):d,maximumFractionDigits:d});};
const fmtBig=v=>{if(v==null||!isFinite(v))return'-';const a=Math.abs(v);if(a>=1e12)return '$'+(v/1e12).toFixed(2)+'T';if(a>=1e9)return '$'+(v/1e9).toFixed(2)+'B';if(a>=1e6)return '$'+(v/1e6).toFixed(2)+'M';return '$'+Math.round(v).toLocaleString('en-US');};
const fmtN=v=>{if(v==null||!isFinite(v))return'-';const a=Math.abs(v);if(a>=1e12)return (v/1e12).toFixed(2)+'T';if(a>=1e9)return (v/1e9).toFixed(2)+'B';if(a>=1e6)return (v/1e6).toFixed(2)+'M';return Math.round(v).toLocaleString('en-US');};
const fmtC=v=>(v==null||!isFinite(v))?'-':(v>0?'+':'')+v.toFixed(2)+'%';
const clsOfV=v=>v>NEUTRAL?'g':v<-NEUTRAL?'r':'p';
const chg=c=>c.ch[tf]||0;
const cls=c=>clsOfV(chg(c));
const css=k=>k==='g'?'up':k==='r'?'dn':'nu';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ====== LAYAR MUAT AWAL ====== */
function setProg(t,pct,note){
  $('bootT').textContent=t;if(pct!=null)$('bootB').style.width=Math.max(2,pct)+'%';
  if(note!=null)$('bootN').textContent=note;
}
let revealing=false;
function reveal(cb){
  if(ready||revealing)return;revealing=true;
  const go=()=>{if(ready)return;ready=true;const b=$('boot');b.style.opacity='0';setTimeout(()=>{b.style.display='none';},360);if(cb)cb();};
  if(needLay||!list.length)relayout(go);else go();
}

/* ====== PENYIMPANAN (IndexedDB): data + logo disimpan -> buka app langsung penuh ====== */
const tex={},maps={};
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('crypto-cloud',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');};r.onsuccess=()=>{DB.db=r.result;res(true);};r.onerror=()=>res(false);r.onblocked=()=>res(false);}catch(e){res(false);}});},
  get(k){return new Promise(res=>{if(!DB.db)return res(null);try{const rq=DB.db.transaction('kv').objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result===undefined?null:rq.result);rq.onerror=()=>res(null);}catch(e){res(null);}});},
  set(k,v){if(!DB.db)return;try{DB.db.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}},
  /* baca banyak kunci dalam SATU transaksi (jauh lebih cepat daripada satu-satu) */
  getMany(keys){return new Promise(res=>{const out={};if(!DB.db||!keys.length)return res(out);try{const tx=DB.db.transaction('kv'),st=tx.objectStore('kv');keys.forEach(k=>{const rq=st.get(k);rq.onsuccess=()=>{if(rq.result!=null)out[k]=rq.result;};});tx.oncomplete=()=>res(out);tx.onerror=tx.onabort=()=>res(out);}catch(e){res(out);}});},
  keys(){return new Promise(res=>{if(!DB.db)return res(new Set());try{const rq=DB.db.transaction('kv').objectStore('kv').getAllKeys();rq.onsuccess=()=>res(new Set(rq.result));rq.onerror=()=>res(new Set());}catch(e){res(new Set());}});}
};

/* ====== LOGO KOIN (cache IndexedDB; diunduh sesuai kebutuhan, yang terlihat duluan) ====== */
const imgs={},lp={};let lq=[],lact=0;
function setLogo(id,im){imgs[id]=im;delete tex[id];}
const scr={};
function fetchLogo(c,keep){
  return new Promise(res=>{
    const big=(c.rank||9999)<=100;
    const url=big?c.image:c.image.replace('/large/','/small/');
    const im=new Image();im.crossOrigin='anonymous';
    im.onload=()=>{
      try{
        const S=big?112:64;
        const cn=keep?document.createElement('canvas'):(scr[S]||(scr[S]=document.createElement('canvas')));
        cn.width=cn.height=S;
        cn.getContext('2d').drawImage(im,0,0,S,S);
        if(cn.toBlob)cn.toBlob(b=>{if(b)DB.set('l:'+c.id,b);},'image/webp',.9);   /* async: tidak memblokir layar */
        else DB.set('l:'+c.id,cn.toDataURL('image/png'));
        if(keep)setLogo(c.id,cn);else if(c.mini===undefined)mkMini(c,cn);
        res();return;
      }catch(e){}
      if(keep)setLogo(c.id,im);res();
    };
    im.onerror=()=>{if(!keep){c.bad=true;res();return;}const i3=new Image();i3.onload=()=>{setLogo(c.id,i3);res();};i3.onerror=()=>{c.bad=true;res();};i3.src=url;};
    im.src=url;
  });
}
function enqLogo(c,res){
  lq.push({c:c,res:res});
  if(lq.length>1500){lq.splice(0,lq.length-1500).forEach(x=>{delete lp[x.c.id];x.res();});}
  pumpLogos();
}
function pumpLogos(){
  while(lact<20&&lq.length){
    const q=lq.pop();lact++;   /* yang terbaru diminta duluan (yang sedang terlihat) */
    fetchLogo(q.c,true).then(()=>{lact--;q.res();pumpLogos();warmPump();});
  }
}
function ensureLogo(c){
  if(!c.image||imgs[c.id])return Promise.resolve();
  if(lp[c.id])return lp[c.id];
  return lp[c.id]=new Promise(res=>{
    DB.get('l:'+c.id).then(u=>{
      if(u){const im=new Image();im.onload=()=>{setLogo(c.id,im);res();};im.onerror=()=>enqLogo(c,res);im.src=u;}
      else enqLogo(c,res);
    });
  });
}
function decodeLogo(u){
  return new Promise((res,rej)=>{
    if(typeof u!=='string'&&window.createImageBitmap){createImageBitmap(u).then(res,rej);return;}
    const im=new Image(),url=typeof u==='string'?u:URL.createObjectURL(u);
    im.onload=()=>{if(typeof u!=='string')URL.revokeObjectURL(url);res(im);};im.onerror=rej;im.src=url;
  });
}
/* muat banyak logo sekaligus: 1 transaksi IndexedDB, sisanya (yang belum ada di cache) diunduh paralel */
async function loadLogos(arr,cb){
  const need=arr.filter(c=>c.image&&!imgs[c.id]&&!lp[c.id]&&!c.pend);
  need.forEach(c=>{c.pend=true;});
  const got=await DB.getMany(need.map(c=>'l:'+c.id));
  let done=0;const tot=need.length;
  await Promise.all(need.map(c=>{
    const u=got['l:'+c.id];
    return lp[c.id]=new Promise(res=>{
      const fin=()=>{c.pend=false;done++;if(cb)cb(done,tot);res();};
      if(u){decodeLogo(u).then(im=>{setLogo(c.id,im);fin();},()=>enqLogo(c,fin));}
      else enqLogo(c,fin);
    });
  }));
}
/* koin yang terlihat di tampilan awal (besar dulu) */
function visibleCoins(max){
  const vx0=-view.x/view.k,vy0=-view.y/view.k,vx1=vx0+W/view.k,vy1=vy0+H/view.k,a=[];
  for(let i=0;i<list.length&&a.length<max;i++){
    const c=list[i],r=c.tr||0;
    if(r*view.k<SPR_MIN)continue;
    if(c.tx+r<vx0||c.tx-r>vx1||c.ty+r<vy0||c.ty-r>vy1)continue;
    a.push(c);
  }
  return a;
}
/* pra-muat logo koin yang langsung terlihat sebelum layar dibuka (selesai jika >=92% siap atau waktu habis) */
function preloadFirst(maxWait){
  return new Promise(res=>{
    if(needLay||!list.length)relayout();
    let a=W?visibleCoins(260):[];
    if(a.length<40)a=list.slice(0,150);
    const tot=a.filter(c=>c.image&&!imgs[c.id]).length;
    if(!tot)return res();
    let fin=false;const end=()=>{if(!fin){fin=true;res();}};
    setTimeout(end,maxWait);
    loadLogos(a,(d,t)=>{setProg('Memuat logo…',70+30*d/t,d+' / '+t);if(d>=t*.8)end();}).then(end);
  });
}
/* logo mini untuk SEMUA koin, otomatis tanpa perlu zoom: baca cache dalam batch, tanpa menyimpan gambar penuh di memori */
async function loadMinis(arr){
  const need=arr.filter(c=>c.image&&!c.bad&&c.mini===undefined&&!imgs[c.id]&&!c.pend&&!c.mpend&&!wseen.has(c.id));
  need.forEach(c=>{c.mpend=true;});
  const got=await DB.getMany(need.map(c=>'l:'+c.id));
  const miss=[];
  await Promise.all(need.map(c=>new Promise(res=>{
    const u=got['l:'+c.id],fin=()=>{c.mpend=false;res();};
    if(!u){miss.push(c);fin();return;}
    decodeLogo(u).then(im=>{if(c.mini===undefined)mkMini(c,im);if(im.close)im.close();fin();},fin);
  })));
  if(miss.length)warmPush(miss,true);
}
let allRun=false;
async function loadAllMinis(){
  if(allRun)return;allRun=true;
  try{

/* ====== LAYOUT GALAKSI: deterministik, instan (tanpa iterasi), koin besar di pusat, spiral keluar ====== */
/* penempatan koin: dihitung di Web Worker (tidak memblokir layar), hasilnya di-cache per mode */
function placeLayout(d){
  var n=d.n,w=d.w,h=d.h,WS=d.WS,KD=d.KD,i,sw=0;
  for(i=0;i<n;i++)sw+=w[i]*w[i];
  var s=WS*.46/Math.sqrt(KD*sw),Rw=WS*.46,C=WS/2,tr=new Float32Array(n),tx=new Float32Array(n),ty=new Float32Array(n),rmax=0;
  for(i=0;i<n;i++){tr[i]=w[i]*s;if(tr[i]>rmax)rmax=tr[i];}
  var cell=Math.max(16,rmax*2+4),cols=Math.ceil(WS/cell)+1;
  var head=new Int32Array(cols*cols).fill(-1),next=new Int32Array(n);
  function rnd(seed){var t=(seed+0x6D2B79F5)|0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
  function cl(v,a,b){return Math.max(a,Math.min(b,v));}
  for(i=0;i<n;i++){
    var r=tr[i],Rc=Rw*(.35+.65*Math.min(1,i/1500)),x=C,y=C,ok=false;
    for(var at=0;at<260&&!ok;at++){
      if(at>0&&at%50===0)Rc=Math.min(Rw,Rc*1.25);
      var sd=(h[i]^Math.imul(at+1,2654435761))|0;
      var ang=rnd(sd)*6.2832,rad=Rc*Math.sqrt(rnd(sd+1013));
      x=cl(C+rad*Math.cos(ang),r+1,WS-r-1);y=cl(C+rad*Math.sin(ang),r+1,WS-r-1);
      var gx=Math.floor(x/cell),gy=Math.floor(y/cell);ok=true;
      for(var oy=-1;oy<=1&&ok;oy++)for(var ox=-1;ox<=1&&ok;ox++){
        var X=gx+ox,Y=gy+oy;if(X<0||Y<0||X>=cols||Y>=cols)continue;
        for(var j=head[X+Y*cols];j>=0;j=next[j]){
          var m=r+tr[j]+3,dx=tx[j]-x,dy=ty[j]-y;
          if(dx*dx+dy*dy<m*m){ok=false;break;}
        }
      }
    }
    tx[i]=x;ty[i]=y;
    var g=Math.floor(x/cell)+Math.floor(y/cell)*cols;next[i]=head[g];head[g]=i;
  }

}
let lw=null,layId=0,layCbs=[],layJob=null;const LC={};
function startWorker(){
  if(lw||typeof Worker==='undefined')return;

    const src='self.onmessage=function(e){var r=('+placeLayout.toString()+')(e.data);r.id=e.data.id;self.postMessage(r,[r.tr.buffer,r.tx.buffer,r.ty.buffer]);};';
    lw=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    lw.onmessage=onLay;lw.onerror=()=>{lw=null;};
  }catch(e){lw=null;}
}
function computeW(L){
  if(sortBy==='pop'){
    let mn=1e30,mx=-1e30;L.forEach(c=>{c.lg=Math.log(Math.max(1,c.score));if(c.lg<mn)mn=c.lg;if(c.lg>mx)mx=c.lg;});
    L.forEach(c=>{const n=(c.lg-mn)/Math.max(.001,mx-mn);c.w=.35+1.5*Math.pow(n,2.1);});
  }else if(sortBy==='vol'){
    const vals=L.map(c=>Math.abs(chg(c))).sort((a,b)=>a-b);
    const cap=Math.max(.5,vals[Math.floor(vals.length*.95)]||1);
    L.forEach(c=>{const v=Math.min(Math.abs(chg(c)),cap)/cap;c.w=.4+1.3*Math.pow(v,.65);});
  }else{
    const sg=sortBy==='gain'?1:-1,val=c=>Math.max(0,chg(c)*sg);
    const vals=L.map(val).filter(v=>v>0).sort((a,b)=>a-b);
    const cap=Math.max(.5,vals[Math.floor(vals.length*.95)]||1);
    L.forEach(c=>{const v=Math.min(val(c),cap)/cap;c.w=.4+1.3*Math.pow(v,.65);});
  }
}
function relayout(cb){

  const L=coins.slice();computeW(L);
  L.sort((a,b)=>b.w-a.w||b.score-a.score);
  const key=sortBy+'|'+L.length,hit=LC[key];
  if(hit&&(sortBy==='pop'||Date.now()-hit.t<300000)){layJob=null;applyLayout(hit.L,hit.r);return;}
  const n=L.length,w=new Float32Array(n),h=new Uint32Array(n);
  for(let i=0;i<n;i++){w[i]=L[i].w;h[i]=L[i].h;}
  const id=++layId;layJob={id:id,L:L,key:key};
  const msg={id:id,n:n,w:w,h:h,WS:WS,KD:KD};

}
function onLay(e){

function getMap(T){
  if(maps[T])return maps[T];
  const R=(T-4)/2,m=T/2,n=T*T,U=new Float32Array(n),V=new Float32Array(n),sh=new Uint8Array(n),sp=new Uint8Array(n),al=new Uint8Array(n);

let prevT=0,glG=null;
const DOTC='rgba(150,168,205,.6)';function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden||!W||!ready){prevT=t;return;}
  const dt=clamp((t-(prevT||t))/16.67,.5,3);prevT=t;physics(dt);motion(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  const tb=performance.now(),moving=(tb-viewT)<180;
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality=moving?'low':'high';
  drawStars(t);
  ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
  const vx0=-view.x/view.k,vy0=-view.y/view.k,vx1=vx0+W/view.k,vy1=vy0+H/view.k;
  if(!glG){glG=ctx.createRadialGradient(WS/2,WS/2,0,WS/2,WS/2,WS*.52);
  glG.addColorStop(0,'rgba(120,90,230,.30)');glG.addColorStop(.35,'rgba(70,50,170,.16)');glG.addColorStop(.7,'rgba(30,60,140,.07)');glG.addColorStop(1,'rgba(10,20,60,0)');}
  ctx.fillStyle=glG;ctx.fillRect(vx0,vy0,vx1-vx0,vy1-vy0);
  /* zoom-out jauh: koin kecil digambar sebagai 1 lapisan cache (1 drawImage), hanya koin besar yang digambar satu per satu */
  let lim=list.length,extra=null;
  if(view.k<=LK&&nBig<list.length){
    if(layerDirty&&(!layerOK||(!moving&&tb-layerT>1500)))buildLayer();
    if(layerOK){ctx.drawImage(layer,0,0,LSZ,LSZ,0,0,WS,WS);lim=nBig;extra=act.filter(c=>c.li>=nBig&&(c.free||c===held));}
  }
  const total=lim+(extra?extra.length:0);
  const P={n:new Path2D()},hl=new Path2D(),miss=[];
  for(let ii=0;ii<total;ii++){
    const c=ii<lim?list[ii]:extra[ii-lim];
    if(c.r<.25)continue;
    const pad=c.r*1.9;
    if(c.x+pad<vx0||c.x-pad>vx1||c.y+pad<vy0||c.y-pad>vy1){if(c.sp)c.sp=null;continue;}
    const sr=c.r*view.k,k=cls(c);
    if(sr>=SPR_MIN||(c.sp&&sr>=SPR_OUT)){
      if(!imgs[c.id]&&c.image&&!c.bad){
        if(!c.pend&&!lp[c.id])miss.push(c);
        if(c.mini)ctx.drawImage(AT[c.ma],c.mx,c.my,24,24,c.x-c.r,c.y-c.r,2*c.r,2*c.r);   /* sementara pakai logo mini sampai versi besar siap */
        continue;
      }
      if((!moving||!c.sp)&&Math.abs(c.tr-c.r)<c.tr*.12+.3&&performance.now()-tb<(moving?3:6)){
        const need=needS(c);
        if(!c.sp||c.spK!==k||c.spImg!==!!imgs[c.id]||c.spMode!==modeOf(c)||(c.spMode&&c.spTx!==chg(c))||c.spS<need*.75||c.spS>need*2.5)mkSprite(c);
      }
      if(c.sp){
        const a=Math.min(1.1,c.r*.12),dx=Math.sin(t*.0006*c.fr+c.ph)*a,dy=Math.cos(t*.0005*c.fr+c.ph*1.3)*a;
        const kk=2*c.r/c.spS,w=c.spT*kk;
        ctx.drawImage(c.sp,c.x+dx-w/2,c.y+dy-w/2,w,w);
        continue;
      }
    }else if(c.sp)c.sp=null;
    /* gelembung kecil: tetap logo asli (mini bulat) */
    if(c.mini===undefined&&imgs[c.id]&&performance.now()-tb<12)mkMini(c,imgs[c.id]);
    if(c.mini){const rr=Math.max(c.r,.8/view.k);ctx.drawImage(AT[c.ma],c.mx,c.my,24,24,c.x-rr,c.y-rr,2*rr,2*rr);continue;}
    if(c.image&&!c.bad)continue;   /* logo sedang dimuat otomatis di latar belakang */
    const pp=P.n,h=Math.max(c.r,1.1/view.k);pp.rect(c.x-h,c.y-h,2*h,2*h);   /* hanya koin tanpa logo sama sekali */
  }
  if(miss.length)loadLogos(miss.slice(0,500));
  ctx.fillStyle=DOTC;ctx.fill(P.n);
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill(hl);
  if(selected){
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.2/view.k;ctx.beginPath();ctx.arc(selected.x,selected.y,selected.r+2/view.k,0,7);ctx.stroke();
  }
  drawMM();
}

/* ====== ZOOM / GESER ala Google Earth di dunia 10.000 x 10.000 ====== */
let KMIN=.03,K0=.2,viewInit=false,zlTxt='',svT=0;
function lim(size){const w=WS*view.k;return w<=size?[(size-w)/2,(size-w)/2]:[size-w,0];}
function saveView(){
  clearTimeout(svT);
  svT=setTimeout(()=>{try{localStorage.setItem('cp_view2',JSON.stringify({k:view.k,cx:(W/2-view.x)/view.k,cy:(H/2-view.y)/view.k}));}catch(e){}},600);
}
function clampView(){
  viewT=performance.now();
  view.k=clamp(view.k,KMIN,MAXK);
  const lx=lim(W),ly=lim(H);
  view.x=clamp(view.x,lx[0],lx[1]);view.y=clamp(view.y,ly[0],ly[1]);
  const z='×'+(view.k/K0).toFixed(view.k/K0<10?1:0);
  if(z!==zlTxt){zlTxt=z;$('zl').textContent=z;}
  saveView();
}
function zoomAt(cx,cy,nk){nk=clamp(nk,KMIN,MAXK);const wx=(cx-view.x)/view.k,wy=(cy-view.y)/view.k;view.k=nk;view.x=cx-wx*nk;view.y=cy-wy*nk;clampView();}
let inert=false,ivx=0,ivy=0,anim=null;
function animTo(k1,cx1,cy1,ms){
  inert=false;
  anim={t0:performance.now(),ms:ms||260,k0:view.k,k1:clamp(k1,KMIN,MAXK),cx0:(W/2-view.x)/view.k,cy0:(H/2-view.y)/view.k,cx1:cx1,cy1:cy1};
}
function motion(dt){
  if(anim){
    const p=clamp((performance.now()-anim.t0)/anim.ms,0,1),e=1-Math.pow(1-p,3);
    const k=anim.k0*Math.pow(anim.k1/anim.k0,e),cx=anim.cx0+(anim.cx1-anim.cx0)*e,cy=anim.cy0+(anim.cy1-anim.cy0)*e;
    view.k=k;view.x=W/2-cx*k;view.y=H/2-cy*k;clampView();
    if(p>=1)anim=null;
  }else if(inert){
    const lx=lim(W),ly=lim(H);
    const tx=view.x+ivx*dt,ty=view.y+ivy*dt;
    const nx=clamp(tx,lx[0],lx[1]),ny=clamp(ty,ly[0],ly[1]);
    if(nx!==tx)ivx=0;if(ny!==ty)ivy=0;
    view.x=nx;view.y=ny;clampView();
    const f=Math.pow(.93,dt);ivx*=f;ivy*=f;
    if(Math.hypot(ivx,ivy)<.15)inert=false;
  }
}
const ctrC=()=>[(W/2-view.x)/view.k,(H/2-view.y)/view.k];
const fast=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});
fast('zi',()=>{const c=ctrC();animTo(view.k*2,c[0],c[1],170);});
fast('zo',()=>{const c=ctrC();animTo(view.k/2,c[0],c[1],170);});
fast('reset',()=>animTo(K0,WS/2,WS/2,500));
cv.addEventListener('wheel',e=>{
  e.preventDefault();anim=null;inert=false;
  const d=e.deltaMode===1?e.deltaY*33:e.deltaY;
  zoomAt(e.offsetX,e.offsetY,view.k*Math.exp(-d*(e.ctrlKey?.01:.0018)));
},{passive:false});
const ptrs=new Map();let drag=null,pinch=null,moved=0,gest=false;
let held=null,hoff=null,hist=[],holdMoved=false,sx=0,sy=0,pend=null,holdTimer=0,vh=[];
const pd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const toW=(px,py)=>({x:(px-view.x)/view.k,y:(py-view.y)/view.k});
function hit(px,py){
  const w=toW(px,py);let best=null,bs=1e9;
  for(const c of list){const rr=Math.max(c.r,7/view.k),d=Math.hypot(c.x-w.x,c.y-w.y);if(d<=rr){const sc=d/rr;if(sc<bs){bs=sc;best=c;}}}
  return best;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  inert=false;anim=null;
  if(ptrs.size===1){
    moved=0;gest=false;holdMoved=false;sx=e.offsetX;sy=e.offsetY;held=null;pend=null;clearTimeout(holdTimer);
    drag={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y};
    vh=[{t:performance.now(),x:e.offsetX,y:e.offsetY}];
    if($('info').style.display!=='block'){
      const b=hit(e.offsetX,e.offsetY);
      /* tahan ~0,4 dtk di atas gelembung lalu seret = pegang & lempar gelembung; geser cepat = geser peta */
      if(b){pend=b;holdTimer=setTimeout(()=>{
        if(pend&&moved<6&&ptrs.size===1){
          held=pend;pend=null;drag=null;
          const w=toW(sx,sy);hoff={x:held.x-w.x,y:held.y-w.y};hist=[{t:performance.now(),x:w.x,y:w.y}];
          try{if(navigator.vibrate)navigator.vibrate(12);}catch(_){}
        }
      },380);}
    }
  }else if(ptrs.size===2){
    gest=true;drag=null;held=null;pend=null;clearTimeout(holdTimer);
    const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    pinch={d:pd(a,b),k:view.k,wx:(mx-view.x)/view.k,wy:(my-view.y)/view.k};
  }
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const nk=clamp(pinch.k*pd(a,b)/pinch.d,KMIN,MAXK);
    view.k=nk;view.x=mx-pinch.wx*nk;view.y=my-pinch.wy*nk;clampView();
  }

    moved=Math.max(moved,Math.hypot(e.offsetX-sx,e.offsetY-sy));

      held.x=clamp(w.x+hoff.x,held.r,WS-held.r);held.y=clamp(w.y+hoff.y,held.r,WS-held.r);
      hist.push({t:now,x:w.x,y:w.y});while(hist.length>2&&now-hist[0].t>100)hist.shift();
      if(hist.length>=2){const f=hist[0],l=hist[hist.length-1],dt=Math.max(8,l.t-f.t);held.vx=(l.x-f.x)/dt*16.7;held.vy=(l.y-f.y)/dt*16.7;}
    }
  }
  else if(drag){
    moved=Math.max(moved,Math.hypot(e.offsetX-sx,e.offsetY-sy));
    if(moved>=6&&pend){pend=null;clearTimeout(holdTimer);}
    view.x=drag.vx+(e.offsetX-drag.x);view.y=drag.vy+(e.offsetY-drag.y);clampView();
    const now=performance.now();vh.push({t:now,x:e.offsetX,y:e.offsetY});while(vh.length>2&&now-vh[0].t>100)vh.shift();
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  const wasTap=ptrs.size===1&&!gest&&moved<8&&e.type==='pointerup';
  ptrs.delete(e.pointerId);clearTimeout(holdTimer);
  if(held){
    const b=held;held=null;
    if(holdMoved){
      let vx=0,vy=0;const now=performance.now();
      if(hist.length>=2&&now-hist[hist.length-1].t<90){const f=hist[0],l=hist[hist.length-1],dt=Math.max(8,l.t-f.t);vx=(l.x-f.x)/dt*16.7;vy=(l.y-f.y)/dt*16.7;}
      const sp=Math.hypot(vx,vy),mx=45;if(sp>mx){vx*=mx/sp;vy*=mx/sp;}
      b.vx=vx;b.vy=vy;b.free=true;b.st=0;wake(b);
    }else if(wasTap)tap(e.offsetX,e.offsetY);
  }else if(wasTap)tap(e.offsetX,e.offsetY);
  else if(drag&&!gest&&ptrs.size===0&&e.type==='pointerup'){
    const now=performance.now();
    if(vh.length>=2&&now-vh[vh.length-1].t<80){
      const f=vh[0],l=vh[vh.length-1],d=Math.max(8,l.t-f.t);

  }

  if(ptrs.size<2)pinch=null;
  if(ptrs.size===1&&!held){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,vx:view.x,vy:view.y};vh=[{t:performance.now(),x:p.x,y:p.y}];}else drag=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function tap(px,py){
  if($('info').style.display==='block')return;
  const b=hit(px,py);b?showInfo(b):hideInfo();

/* ====== FISIKA: tahan & lempar gelembung ====== */
function physics(dt){
  if(!act.length)return;
  const hm=h=>h===held&&holdMoved;
  let w=0;
  for(let i=0;i<act.length;i++){
    const c=act[i];c.r+=(c.tr-c.r)*.16;
    let keep=Math.abs(c.tr-c.r)>.02;
    if(hm(c)){const f=Math.pow(.8,dt);c.vx*=f;c.vy*=f;act[w++]=c;continue;}
    if(c.free){
      c.x+=c.vx*dt;c.y+=c.vy*dt;const f=Math.pow(.985,dt);c.vx*=f;c.vy*=f;keep=true;
      if(c.x<c.r){c.x=c.r;c.vx=Math.abs(c.vx)*.8;}else if(c.x>WS-c.r){c.x=WS-c.r;c.vx=-Math.abs(c.vx)*.8;}
      if(c.y<c.r){c.y=c.r;c.vy=Math.abs(c.vy)*.8;}else if(c.y>WS-c.r){c.y=WS-c.r;c.vy=-Math.abs(c.vy)*.8;}
    }else{
      c.x+=(c.tx-c.x)*.16;c.y+=(c.ty-c.y)*.16;
      if(Math.abs(c.tx-c.x)>.03||Math.abs(c.ty-c.y)>.03)keep=true;else{c.x=c.tx;c.y=c.ty;}
    }
    if(keep)act[w++]=c;else c.aw=false;
  }
  act.length=w;
  const n=list.length;
  for(let ai=0;ai<act.length;ai++){
    const a=act[ai],aAct=a.free||hm(a);if(!aAct)continue;const i=a.li;
    for(let j=0;j<n;j++){
      if(j===i)continue;const b=list[j],bAct=b.free||hm(b);
      if(bAct&&j<i)continue;
      const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;
      if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
      const d=Math.hypot(dx,dy);if(d>=m||d<.001)continue;
      const nx=dx/d,ny=dy/d,o=m-d;
      const ia=hm(a)?0:1/(a.r*a.r),ib=hm(b)?0:1/(b.r*b.r),is=ia+ib;if(!is)continue;
      a.x-=nx*o*ia/is;a.y-=ny*o*ia/is;b.x+=nx*o*ib/is;b.y+=ny*o*ib/is;
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){const jj=-(1+.7)*vn/is;a.vx-=jj*ia*nx;a.vy-=jj*ia*ny;b.vx+=jj*ib*nx;b.vy+=jj*ib*ny;}
      if(!b.free&&!hm(b)){b.free=true;b.st=0;wake(b);}
      if(!a.free&&!hm(a)){a.free=true;a.st=0;wake(a);}
    }
  }
  for(let ai=0;ai<act.length;ai++){
    const c=act[ai];if(!c.free||hm(c))continue;
    if(Math.hypot(c.vx,c.vy)<.08){if(++c.st>25){c.free=false;layerDirty=true;c.tx=clamp(c.x,c.tr+1,WS-c.tr-1);c.ty=clamp(c.y,c.tr+1,WS-c.tr-1);c.vx=c.vy=0;}}
    else c.st=0;
  }
}

/* ====== RESIZE ====== */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  if(w===W&&h===H)return;
  mmK=-1;W=w;H=h;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  KMIN=Math.min(W,H)/WS;K0=clamp(W/2200,KMIN,MAXK);
  if(!viewInit){
    viewInit=true;let v=null;
    try{v=JSON.parse(localStorage.getItem('cp_view2')||'null');}catch(e){}
    if(v&&isFinite(v.k)&&isFinite(v.cx)&&isFinite(v.cy)){view.k=v.k;view.x=W/2-v.cx*v.k;view.y=H/2-v.cy*v.k;}
    else{view.k=K0;view.x=W/2-WS/2*K0;view.y=H/2-WS/2*K0;}
  }
  clampView();
}
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(resize,120);}).observe(stage);

/* ====== IKON PWA (dibuat saat runtime) ====== */
(function(){
  try{
    const cn=document.createElement('canvas');cn.width=cn.height=512;const g=cn.getContext('2d');
    g.fillStyle='#000';g.fillRect(0,0,512,512);
    [[221,233,105,'#22e07a'],[361,163,58,'#ff4d4d'],[349,349,81,'#a78bfa'],[151,384,47,'#ff4d4d']].forEach(d=>{g.fillStyle=d[3];g.beginPath();g.arc(d[0],d[1],d[2],0,7);g.fill();});
    const u=cn.toDataURL('image/png'),h=document.head;
    [['apple-touch-icon'],['icon']].forEach(r=>{const l=document.createElement('link');l.rel=r[0];l.href=u;h.appendChild(l);});
    const man={name:'Crypto Price',short_name:'Crypto Price',display:'standalone',orientation:'portrait',background_color:'#000000',theme_color:'#000000',start_url:'.',icons:[{src:u,sizes:'512x512',type:'image/png'}]};
    const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));h.appendChild(ml);
  }catch(e){}
})();

/* ====== START: cache lengkap (data + logo teratas + posisi layar) -> semua koin langsung muncul sekaligus ====== */
(async function boot(){
  resize();
  requestAnimationFrame(frame);
  await DB.open();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  let cached=await DB.get('data');
  if(!cached||!cached.d||!cached.d.length){cached=null;try{cached=JSON.parse(localStorage.getItem('cg_cache1')||'null');}catch(e){}}
  if(cached&&cached.d&&cached.d.length){
    ingest(cached.d);lastT=cached.t||0;demo=false;
    const age=Date.now()-lastT;
    if(cached.done&&age<FRESH_MS){fullDone=true;}
    else if(!cached.done&&age<FRESH_MS){fullNext=cached.next||1;}
    else{fullNext=1;fullDone=false;}   /* cache lama: sapuan penuh diam-diam di latar belakang */
    refreshUI();
    if(cached.done){
      reveal(()=>{kickLogos();warmPush(coins);});   /* cache ada: langsung tampil, tanpa layar loading */
    }else setProg('Melanjutkan muat…',(fullNext-1)/PAGES*100);
  }else setProg('Memuat 0%',0,'Pertama kali: mengunduh 10.000 koin, selanjutnya langsung tampil dari cache');
  load();startWorker();setInterval(warmPump,600);
  setInterval(()=>{if(!document.hidden)load();},REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastT>REFRESH_MS)load();});
})();
})();
</script>
